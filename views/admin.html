<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PassTrace // ADMIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"></head>
<body class="admin"><div class="scan"></div>
<header><h1>PassTrace // ADMIN CONSOLE</h1></header>
<main class="admin-main">
<section id="login"><p>Admin password</p><div class="row"><input id="pw" type="password" autocomplete="current-password" aria-label="admin password"><button id="go">LOGIN</button></div><p id="lerr" class="err"></p></section>
<section id="panel" hidden>
  <div class="admin-summary"><p id="info"></p><label><input type="checkbox" id="board"> Public leaderboard</label></div>
  <div class="admin-grid">
    <section class="admin-card"><h2>EVENT CONTROLS</h2>
      <p class="admin-actions"><button data-a="start">START</button> <button data-a="pause">PAUSE</button> <button data-a="resume">RESUME</button> <button data-a="end">END</button> <button data-a="reset">RESET</button></p>
      <p>Start time (GST): <input type="datetime-local" id="sched"> <button id="ss">SCHEDULE</button> <button id="sc">CLEAR</button></p><p id="sinfo" class="dim"></p>
      <p>Claimed classes: <span id="claimed"></span></p><p>Release a class: <input id="rel" size="5" placeholder="e.g. 10A"> <button id="rb">RELEASE</button></p>
    </section>
    <section class="admin-card"><h2>CLOSEST GUESS SO FAR</h2><p id="topGuess">No guesses yet.</p><h3>BY CLASS</h3><table id="best"></table></section>
    <section class="admin-card"><h2>LIVE MESSAGE / HINT</h2><textarea id="message" rows="3" maxlength="500" placeholder="Write a hint or announcement for all players"></textarea><p><span id="msgInfo" class="dim">Nothing released yet.</span></p><button id="releaseMessage">RELEASE TO ALL</button></section>
    <section class="admin-card"><h2>NETWORK STATISTICS</h2><p id="network"></p></section>
    <section class="admin-card"><h2>SOLVERS</h2><table id="sv"></table></section>
    <section class="admin-card admin-waterfall"><h2>GUESS WATERFALL <small>(latest 10)</small></h2><div class="waterfall-tools"><label for="waterfallSort">Sort by:</label> <select id="waterfallSort"><option value="latest">Latest first</option><option value="class">Class</option></select></div><table id="waterfall"></table></section>
  </div>
  <p class="admin-logout"><button id="lo">LOGOUT</button></p>
</section></main>
<script src="/js/admin.js"></script></body></html>
