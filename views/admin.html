<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HACKME // ADMIN</title>
<link rel="stylesheet" href="/css/style.css"></head>
<body><div class="scan"></div>
<header><h1>ADMIN CONSOLE</h1></header>
<main style="grid-template-columns:1fr;max-width:760px;margin:auto">
<section id="login"><p>Admin password</p><div class="row"><input id="pw" type="password" autocomplete="current-password" aria-label="admin password"><button id="go">LOGIN</button></div><p id="lerr" class="err"></p></section>
<section id="panel" hidden>
  <p id="info"></p>
  <p><button data-a="start">START</button> <button data-a="pause">PAUSE</button> <button data-a="resume">RESUME</button> <button data-a="end">END</button> <button data-a="reset">RESET</button></p>
  <p>Start time (GST): <input type="datetime-local" id="sched" style="border-bottom:1px solid var(--d)"> <button id="ss">SCHEDULE</button> <button id="sc">CLEAR</button> <span id="sinfo"></span></p>
  <p>Hint times (minutes): <input id="times" style="border-bottom:1px solid var(--d);max-width:140px"> <button id="st">SAVE</button></p>
  <p><label><input type="checkbox" id="board"> Public leaderboard</label></p>
  <h3>SOLVERS</h3><table id="sv" style="width:100%"></table>
  <p><button id="lo">LOGOUT</button></p>
</section></main>
<script src="/js/admin.js"></script></body></html>
