<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PassTrace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<canvas id="rain" hidden></canvas>
<header>
  <div class="brand"><h1 class="glitch" data-t="PassTrace">PassTrace</h1><div class="org">ADIS - NeuralNex | By : Alfred, Haron 12C | nihcoc | PhilosopherOfCode</div></div>
  <div id="bar">CONNECTING...</div>
</header>
<main>
  <section id="term">
    <aside id="commandMap" aria-label="PassTrace command map">
      <h2>PassTrace // cybersecurity awareness exercise</h2>
      <div id="commandList"></div>
    </aside>
    <div id="out"></div>
    <div class="row"><span>&gt;</span><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="terminal input" autofocus></div>
  </section>
  <section id="desk" hidden></section>
</main>
<div id="win" hidden></div>
<div id="cls" hidden></div>
<div id="eventOverlay" class="event-overlay" role="status" aria-live="assertive" hidden></div>
<script src="/js/app.js"></script>
</body>
</html>
